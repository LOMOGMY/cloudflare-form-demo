<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cloudflare Pages 表单 Demo</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 16px;
      line-height: 1.6;
    }

    h1 {
      font-size: 28px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #0055ff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 16px;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    .success {
      display: block;
      background: #e6f7e6;
      color: #166534;
      border: 1px solid #86efac;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .honeypot {
      position: absolute;
      left: -9999px;
      opacity: 0;
      height: 0;
      width: 0;
    }
  </style>
</head>
<body>
  <h1>留言表单</h1>
  <p>这是一个 Cloudflare Pages + D1 的免费表单示例。</p>

  <form id="form">
    <label for="name">姓名</label>
    <input id="name" name="name" placeholder="请输入姓名" required />

    <label for="contact">联系方式</label>
    <input id="contact" name="contact" placeholder="邮箱、微信或手机号都可以" />

    <label for="message">内容</label>
    <textarea id="message" name="message" placeholder="请输入内容" required></textarea>

    <!-- 简单反垃圾字段，正常用户看不到 -->
    <input class="honeypot" name="website" tabindex="-1" autocomplete="off" />

    <button type="submit">提交</button>
  </form>

  <div id="status"></div>

  <script>
    const form = document.getElementById('form');
    const statusBox = document.getElementById('status');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const button = form.querySelector('button');
      button.disabled = true;
      statusBox.className = '';
      statusBox.style.display = 'block';
      statusBox.textContent = '正在提交...';

      const formData = new FormData(form);
      const payload = Object.fromEntries(formData.entries());

      try {
        const response = await fetch('/api/submit', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (response.ok && result.ok) {
          statusBox.className = 'success';
          statusBox.textContent = '提交成功！';
          form.reset();
        } else {
          statusBox.className = 'error';
          statusBox.textContent = '提交失败：' + (result.error || '未知错误');
        }
      } catch (error) {
        statusBox.className = 'error';
        statusBox.textContent = '请求失败：' + error;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
